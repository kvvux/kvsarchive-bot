name: CI

on:
  push:
    branches:
      - main
      - 'chatgpt/**'
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript
        run: npm test
